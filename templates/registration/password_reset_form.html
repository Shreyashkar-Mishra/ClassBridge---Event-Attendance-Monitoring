{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex bg-slate-50 items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-navy-900">
        Reset Password
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.
      </p>
    </div>
    <form class="mt-8 space-y-6" action="{% url 'password_reset' %}" method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-navy-900 hover:bg-navy-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-navy-900">
          Send Reset Instructions
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
