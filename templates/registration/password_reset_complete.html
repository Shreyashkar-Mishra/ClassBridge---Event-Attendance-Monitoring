{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex bg-slate-50 items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl text-center">
    <div>
      <h2 class="mt-6 text-3xl font-extrabold text-navy-900">
        Password Reset Complete
      </h2>
      <div class="mt-6 p-4 rounded-lg bg-emerald-50 border border-emerald-200">
        <p class="text-sm text-emerald-800">
          Your password has been successfully set. You may go ahead and log in now.
        </p>
      </div>
    </div>
    <div class="mt-6">
      <a href="{% url 'login' %}" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-navy-900 hover:bg-navy-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-navy-900">
        Sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
